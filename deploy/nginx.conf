# Nginx：托管前端静态文件 + 转发 Socket.IO 与 API
# 使用前：把三处 your_domain_or_ip 换成域名或公网 IP
# 只用 HTTP（无证书）时：删掉 443 段，把 80 段的 location / 改成下面的静态托管即可

# ---------- HTTP：certbot 校验 + 301 跳 HTTPS ----------
server {
    listen 80;
    server_name your_domain_or_ip;

    # Let's Encrypt 校验目录（申请证书期间保留这段）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：正式站点 ----------
server {
    listen 443 ssl http2;
    server_name your_domain_or_ip;

    ssl_certificate     /etc/letsencrypt/live/your_domain_or_ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain_or_ip/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/op-monopoly;       # npm run build:deploy 产出的 dist 放这里
    index index.html;

    location ~* \.(js|css)$ { expires 7d; }
    location ~* \.(png|jpg|jpeg|webp|mp3|wav)$ { expires 30d; }

    # 前端单页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Socket.IO（WebSocket Upgrade）—— 少任何一个 Upgrade 头都会退化成轮询甚至连不上
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;      # 长连接不被 60s 默认超时掐断
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
