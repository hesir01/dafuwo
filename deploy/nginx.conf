# Nginx 反向代理（外层）：暴露 80/443，全反代到 Node(127.0.0.1:8010)
# 静态文件 / API / Socket.IO 仍由 Node 直出，Nginx 只负责 HTTPS 卸载 + 端口收敛
# 本机已部署：Node 单端口直出 8010（Express 静态托管 dist + Socket.IO 同进程）
#
# 前置：
#   sudo ufw allow 80/tcp && sudo ufw allow 443/tcp
# 证书（certbot，webroot 模式，不改动本文件）：
#   sudo certbot certonly --webroot -w /var/www/certbot -d boluodafuwo.duckdns.org
# 之后：sudo nginx -t && sudo systemctl reload nginx

# ---------- HTTP：证书校验 + 301 跳 HTTPS ----------
server {
    listen 80;
    server_name boluodafuwo.duckdns.org;

    # Let's Encrypt 校验目录（申请证书期间保留这段）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：正式站点 ----------
server {
    listen 443 ssl http2;
    server_name boluodafuwo.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/boluodafuwo.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boluodafuwo.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 全反代到 Node(8010)
    # ⚠️ WebSocket Upgrade 头一个都不能少，否则联机会退化成轮询甚至直接失败
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;      # 长连接不被 60s 默认超时掐断
    }
}
